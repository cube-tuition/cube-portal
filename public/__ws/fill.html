import { questionBlock, newPage, headerHtml, PAGE_H } from '/__ws/_wslib.mjs'
const doc = {"title":"Word Problems","subtitle":"Year 6 Maths · Term 3 revision","questions":[{"id":"4b6b1cbb-3c30-4590-b918-7f85f2eac6bf","skill_id":null,"stem_latex":"A rectangular vegetable patch is $12$ m long and $7$ m wide. Which calculation finds the **area** of the patch?","solution_latex":"Area is the space **inside**, found by $\\text{length} \\times \\text{width}$: $12 \\times 7 = 84$ m². Option **B** is the **perimeter** — the distance **around** the edge, which is $38$ m. Read whether the question wants what is inside or what goes around.","difficulty":2,"marks":1,"is_multipart":false,"created_by":"Ryan Park","created_at":"2026-08-20T01:53:59.881906+00:00","updated_at":"2026-08-20T01:53:59.881906+00:00","qtype":"mcq","options":[{"label":"A","latex":"$12 + 7$"},{"label":"B","latex":"$2 \\times (12 + 7)$"},{"label":"C","latex":"$12 \\times 7$"},{"label":"D","latex":"$12 - 7$"}],"correct_option":"C","criteria":{},"topic_id":"053f7655-c652-4a64-9080-3f20e7bf6096","audience":"exam","subtopic_id":"c23427fe-7b11-4f30-8f10-2348a1e1a834","qbank_question_parts":[]},{"id":"b8b89905-4e81-4b5e-bd5b-9387aaae9827","skill_id":null,"stem_latex":"A bottle holds $1.5$ L. A glass holds $250$ mL. Which calculation finds how many full glasses can be poured from the bottle?","solution_latex":"The two amounts are in **different units**, so convert first: $1.5$ L $= 1500$ mL. Then divide: $1500 \\div 250 = 6$ glasses. Option **C** divides without converting, which is the most common slip here.","difficulty":2,"marks":1,"is_multipart":false,"created_by":"Ryan Park","created_at":"2026-08-20T01:54:00.352846+00:00","updated_at":"2026-08-20T01:54:00.352846+00:00","qtype":"mcq","options":[{"label":"A","latex":"$1.5 \\times 250$"},{"label":"B","latex":"$1500 \\div 250$"},{"label":"C","latex":"$1.5 \\div 250$"},{"label":"D","latex":"$1500 \\times 250$"}],"correct_option":"B","criteria":{},"topic_id":"053f7655-c652-4a64-9080-3f20e7bf6096","audience":"exam","subtopic_id":"0891ef80-7cc6-4695-a54d-a65c83bbb327","qbank_question_parts":[]},{"id":"dcbbbad7-edfb-434d-85d1-0ebf9fb682db","skill_id":null,"stem_latex":"A parcel has a mass of $2.4$ kg. A second parcel has a mass of $850$ g. Which calculation finds the **total mass in grams**?","solution_latex":"Convert to the unit the answer is asked for: $2.4$ kg $= 2400$ g, so the total is $2400 + 850 = 3250$ g. Option **C** is a correct total but in **kilograms** ($3.25$ kg) — always check which unit the question wants.","difficulty":2,"marks":1,"is_multipart":false,"created_by":"Ryan Park","created_at":"2026-08-20T01:54:00.911034+00:00","updated_at":"2026-08-20T01:54:00.911034+00:00","qtype":"mcq","options":[{"label":"A","latex":"$2.4 + 850$"},{"label":"B","latex":"$2400 + 850$"},{"label":"C","latex":"$2.4 + 0.85$"},{"label":"D","latex":"$2400 - 850$"}],"correct_option":"B","criteria":{},"topic_id":"053f7655-c652-4a64-9080-3f20e7bf6096","audience":"exam","subtopic_id":"b2f27c7f-23b0-4eae-80ae-360ecb23455e","qbank_question_parts":[]},{"id":"230fa43a-8b33-43d2-b4b9-c6009ad555ad","skill_id":null,"stem_latex":"Read this problem carefully.\n\nA classroom floor is $8$ m long and $6$ m wide. Carpet costs $\\$45$ for each square metre. Find the total cost of carpeting the floor.","solution_latex":"This question has two steps, and the cost cannot be found until the area is.","difficulty":1,"marks":3,"is_multipart":true,"created_by":"Ryan Park","created_at":"2026-08-20T01:53:56.50149+00:00","updated_at":"2026-08-20T02:02:33.761193+00:00","qtype":"extended","options":[],"correct_option":null,"criteria":{},"topic_id":"053f7655-c652-4a64-9080-3f20e7bf6096","audience":"exam","subtopic_id":"c23427fe-7b11-4f30-8f10-2348a1e1a834","qbank_question_parts":[{"id":"f27bf669-1f3a-4f3a-b5a6-c22939ed434a","question_id":"230fa43a-8b33-43d2-b4b9-c6009ad555ad","part_label":"a","prompt_latex":"What is the question asking you to find?","solution_latex":"The **total cost** of the carpet, in dollars.","marks":1,"sort_order":0,"criteria":{}},{"id":"ec59a933-bec6-4f85-967b-872fc2583b95","question_id":"230fa43a-8b33-43d2-b4b9-c6009ad555ad","part_label":"b","prompt_latex":"What information are you given?","solution_latex":"The floor is $8$ m long and $6$ m wide, and carpet costs $\\$45$ per square metre.","marks":1,"sort_order":1,"criteria":{}},{"id":"14261f2f-6d59-475e-9514-ff3874021444","question_id":"230fa43a-8b33-43d2-b4b9-c6009ad555ad","part_label":"c","prompt_latex":"What would you do to work it out? Name each step, in order.","solution_latex":"**Step 1** — find the area of the floor: $\\text{length} \\times \\text{width}$.\n**Step 2** — multiply that area by $\\$45$, because every square metre costs $\\$45$.","marks":1,"sort_order":2,"criteria":{}}],"_workingLines":{"a":6,"b":8,"c":13}},{"id":"da23e6c9-208b-4c86-9736-1fef877546d3","skill_id":null,"stem_latex":"Read this problem carefully.\n\nA crate holds $24$ identical tins. The full crate has a mass of $19.2$ kg. The empty crate has a mass of $1.2$ kg. Find the mass of one tin, in grams.","solution_latex":"Three steps. Notice the answer is asked for in **grams**, but every mass given is in kilograms — the conversion is part of the question.","difficulty":2,"marks":3,"is_multipart":true,"created_by":"Ryan Park","created_at":"2026-08-20T01:53:57.109921+00:00","updated_at":"2026-08-20T02:02:34.878302+00:00","qtype":"extended","options":[],"correct_option":null,"criteria":{},"topic_id":"053f7655-c652-4a64-9080-3f20e7bf6096","audience":"exam","subtopic_id":"b2f27c7f-23b0-4eae-80ae-360ecb23455e","qbank_question_parts":[{"id":"650f2784-794d-4cfa-a190-8f045d67e615","question_id":"da23e6c9-208b-4c86-9736-1fef877546d3","part_label":"a","prompt_latex":"What is the question asking you to find?","solution_latex":"The mass of **one tin**, in **grams**.","marks":1,"sort_order":0,"criteria":{}},{"id":"6831bef2-57dc-4836-8aa5-3cc2b08ae7c1","question_id":"da23e6c9-208b-4c86-9736-1fef877546d3","part_label":"b","prompt_latex":"What information are you given?","solution_latex":"There are $24$ tins; the full crate is $19.2$ kg; the empty crate is $1.2$ kg.","marks":1,"sort_order":1,"criteria":{}},{"id":"e2244233-3880-4969-9773-f2cf60365864","question_id":"da23e6c9-208b-4c86-9736-1fef877546d3","part_label":"c","prompt_latex":"What would you do to work it out? Name each step, in order.","solution_latex":"**Step 1** — subtract the empty crate from the full crate, to get the mass of all $24$ tins.\n**Step 2** — divide by $24$ to get one tin.\n**Step 3** — convert kilograms to grams, because the question asks for grams.","marks":1,"sort_order":2,"criteria":{}}],"_workingLines":{"a":6,"b":8,"c":13}},{"id":"b3a8d968-07a2-441d-84a5-2fa077f82747","skill_id":null,"stem_latex":"Read this problem carefully.\n\nA cinema session begins at $6{:}45$ PM. There are $15$ minutes of advertisements, and then the movie runs for $2$ hours $20$ minutes. What time does the movie finish?","solution_latex":"The trap is answering the time the **session** starts. The movie does not begin until the advertisements have finished.","difficulty":2,"marks":3,"is_multipart":true,"created_by":"Ryan Park","created_at":"2026-08-20T01:53:58.543798+00:00","updated_at":"2026-08-20T02:02:35.200603+00:00","qtype":"extended","options":[],"correct_option":null,"criteria":{},"topic_id":"702c0b8b-4cbc-4796-9703-8c1b27e53914","audience":"exam","subtopic_id":"3292b89e-e6ed-4ffd-aada-a1ff2716f0b9","qbank_question_parts":[{"id":"fd42c11b-6acc-4379-b727-631be6d98e1b","question_id":"b3a8d968-07a2-441d-84a5-2fa077f82747","part_label":"a","prompt_latex":"What is the question asking you to find?","solution_latex":"The time the **movie finishes**.","marks":1,"sort_order":0,"criteria":{}},{"id":"7d2148c3-7357-4a49-8957-24cfd3b7e096","question_id":"b3a8d968-07a2-441d-84a5-2fa077f82747","part_label":"b","prompt_latex":"What information are you given?","solution_latex":"The session begins at $6{:}45$ PM, there are $15$ minutes of advertisements, and the movie runs for $2$ hours $20$ minutes.","marks":1,"sort_order":1,"criteria":{}},{"id":"ea24de13-ea64-42d9-b739-c365de09ea69","question_id":"b3a8d968-07a2-441d-84a5-2fa077f82747","part_label":"c","prompt_latex":"What would you do to work it out? Name each step, in order.","solution_latex":"**Step 1** — add $15$ minutes to $6{:}45$ PM to find when the movie actually starts.\n**Step 2** — add $2$ hours $20$ minutes to that time.","marks":1,"sort_order":2,"criteria":{}}],"_workingLines":{"a":6,"b":8,"c":13}},{"id":"e1e24c46-e8be-4809-a147-f775bd323e0e","skill_id":null,"stem_latex":"Read this problem carefully.\n\nTickets to a school concert cost $\\$t$ each. A family buys $5$ tickets and also pays a $\\$12$ booking fee. Write an expression for the total amount the family pays.","solution_latex":"The answer is an **expression**, not a number — there is no value of $t$ to substitute.","difficulty":2,"marks":3,"is_multipart":true,"created_by":"Ryan Park","created_at":"2026-08-20T01:53:59.304881+00:00","updated_at":"2026-08-20T02:02:36.102831+00:00","qtype":"extended","options":[],"correct_option":null,"criteria":{},"topic_id":"5ae65e41-cfe3-48ce-934b-979c25e44ccd","audience":"exam","subtopic_id":"e4385ea3-a870-49f2-b5b4-74b4f0da716b","qbank_question_parts":[{"id":"51db4e6f-0b38-416f-a377-e4e0a8e33fa1","question_id":"e1e24c46-e8be-4809-a147-f775bd323e0e","part_label":"a","prompt_latex":"What is the question asking you to find?","solution_latex":"An **expression** for the total amount paid. (Not a number — we are not told what $t$ is.)","marks":1,"sort_order":0,"criteria":{}},{"id":"36ce0753-ee34-47b3-ae36-e0ae12e0fa24","question_id":"e1e24c46-e8be-4809-a147-f775bd323e0e","part_label":"b","prompt_latex":"What information are you given?","solution_latex":"Each ticket costs $\\$t$; they buy $5$ tickets; there is one $\\$12$ booking fee.","marks":1,"sort_order":1,"criteria":{}},{"id":"0d8a5c66-83b9-4d35-8a65-8a3e80644432","question_id":"e1e24c46-e8be-4809-a147-f775bd323e0e","part_label":"c","prompt_latex":"What would you do to work it out? Name each step, in order.","solution_latex":"**Step 1** — multiply the ticket price by $5$, because there are $5$ tickets.\n**Step 2** — add $12$, because the booking fee is paid once, not once per ticket.","marks":1,"sort_order":2,"criteria":{}}],"_workingLines":{"a":6,"b":8,"c":13}},{"id":"81380858-7121-4b77-8e47-c65543e00b69","skill_id":null,"stem_latex":"A rectangular playground measures $15$ m by $9$ m. Synthetic grass is laid over the whole playground. What area of grass is needed?","solution_latex":"Grass covers the inside, so this is area.\n$$ A = 15 \\times 9 = \\mathbf{135 \\text{ m}^2} $$","difficulty":2,"marks":2,"is_multipart":false,"created_by":"Ryan Park","created_at":"2026-08-20T01:54:01.304393+00:00","updated_at":"2026-08-20T01:54:01.304393+00:00","qtype":"extended","options":[],"correct_option":null,"criteria":{},"topic_id":"053f7655-c652-4a64-9080-3f20e7bf6096","audience":"exam","subtopic_id":"c23427fe-7b11-4f30-8f10-2348a1e1a834","qbank_question_parts":[],"_workingLines":{"_":8}},{"id":"5a39ad9b-3194-4cae-bfcf-86c4a74db1a9","skill_id":null,"stem_latex":"A fish tank is a rectangular prism $60$ cm long, $30$ cm wide and $40$ cm high. Find the volume of the tank.","solution_latex":"$$ V = \\text{length} \\times \\text{width} \\times \\text{height} $$\n$$ V = 60 \\times 30 \\times 40 = \\mathbf{72\\,000 \\text{ cm}^3} $$","difficulty":2,"marks":2,"is_multipart":false,"created_by":"Ryan Park","created_at":"2026-08-20T01:54:01.74359+00:00","updated_at":"2026-08-20T01:54:01.74359+00:00","qtype":"extended","options":[],"correct_option":null,"criteria":{},"topic_id":"053f7655-c652-4a64-9080-3f20e7bf6096","audience":"exam","subtopic_id":"0891ef80-7cc6-4695-a54d-a65c83bbb327","qbank_question_parts":[],"_workingLines":{"_":8}},{"id":"f365f236-1845-4eda-8ccc-36158ade5614","skill_id":null,"stem_latex":"A bag of potatoes has a mass of $3.5$ kg. A bag of onions has a mass of $1250$ g. How much heavier is the bag of potatoes, **in grams**?","solution_latex":"\"How much heavier\" means subtract — but convert first, since the answer is wanted in grams.\n$$ 3.5 \\text{ kg} = 3500 \\text{ g} $$\n$$ 3500 - 1250 = \\mathbf{2250 \\text{ g}} $$","difficulty":2,"marks":2,"is_multipart":false,"created_by":"Ryan Park","created_at":"2026-08-20T01:54:02.186281+00:00","updated_at":"2026-08-20T01:54:02.186281+00:00","qtype":"extended","options":[],"correct_option":null,"criteria":{},"topic_id":"053f7655-c652-4a64-9080-3f20e7bf6096","audience":"exam","subtopic_id":"b2f27c7f-23b0-4eae-80ae-360ecb23455e","qbank_question_parts":[],"_workingLines":{"_":8}},{"id":"ebc16fd9-8f6c-493a-a1cf-8ecb99107c0c","skill_id":null,"stem_latex":"A bus leaves the depot at $7{:}38$ AM and the trip takes $55$ minutes. What time does it arrive?","solution_latex":"Adding time is easier in two hops — go up to the next hour first.\n$7{:}38 + 22$ min $= 8{:}00$, and $55 - 22 = 33$ minutes are left.\n$$ 8{:}00 + 33 \\text{ min} = \\mathbf{8{:}33 \\text{ AM}} $$","difficulty":2,"marks":2,"is_multipart":false,"created_by":"Ryan Park","created_at":"2026-08-20T01:54:02.618778+00:00","updated_at":"2026-08-20T01:54:02.618778+00:00","qtype":"extended","options":[],"correct_option":null,"criteria":{},"topic_id":"702c0b8b-4cbc-4796-9703-8c1b27e53914","audience":"exam","subtopic_id":"3292b89e-e6ed-4ffd-aada-a1ff2716f0b9","qbank_question_parts":[],"_workingLines":{"_":8}},{"id":"7af3e8e3-adba-4ef5-960a-38a146b08934","skill_id":null,"stem_latex":"Oranges cost $\\$c$ each. Wei buys $6$ oranges and one reusable bag that costs $\\$2$. Write an expression for the total cost.","solution_latex":"Six oranges cost $6 \\times c = 6c$, and the bag adds $\\$2$ once.\n$$ \\mathbf{6c + 2} $$","difficulty":2,"marks":2,"is_multipart":false,"created_by":"Ryan Park","created_at":"2026-08-20T01:54:03.102017+00:00","updated_at":"2026-08-20T01:54:03.102017+00:00","qtype":"extended","options":[],"correct_option":null,"criteria":{},"topic_id":"5ae65e41-cfe3-48ce-934b-979c25e44ccd","audience":"exam","subtopic_id":"e4385ea3-a870-49f2-b5b4-74b4f0da716b","qbank_question_parts":[],"_workingLines":{"_":8}},{"id":"c681f0ec-2262-4412-8c72-d38a26c440f2","skill_id":null,"stem_latex":"The perimeter of a square is given by the formula $P = 4s$, where $s$ is the side length. Find $P$ when $s = 9.5$ cm.","solution_latex":"Substitute $s = 9.5$ into the formula.\n$$ P = 4 \\times 9.5 = \\mathbf{38 \\text{ cm}} $$","difficulty":2,"marks":2,"is_multipart":false,"created_by":"Ryan Park","created_at":"2026-08-20T01:54:03.514251+00:00","updated_at":"2026-08-20T01:54:03.514251+00:00","qtype":"extended","options":[],"correct_option":null,"criteria":{},"topic_id":"5ae65e41-cfe3-48ce-934b-979c25e44ccd","audience":"exam","subtopic_id":"e4385ea3-a870-49f2-b5b4-74b4f0da716b","qbank_question_parts":[],"_workingLines":{"_":8}},{"id":"3bfc2548-5d0c-4972-beb5-3b5caace6139","skill_id":null,"stem_latex":"A rectangular deck is $6$ m long and $4.5$ m wide. Decking oil costs $\\$18$ for each square metre.","solution_latex":"A cost-per-square-metre question is always area first, then multiply.","difficulty":3,"marks":4,"is_multipart":true,"created_by":"Ryan Park","created_at":"2026-08-20T01:54:03.979722+00:00","updated_at":"2026-08-20T01:54:03.979722+00:00","qtype":"extended","options":[],"correct_option":null,"criteria":{},"topic_id":"053f7655-c652-4a64-9080-3f20e7bf6096","audience":"exam","subtopic_id":"c23427fe-7b11-4f30-8f10-2348a1e1a834","qbank_question_parts":[{"id":"af2bb32f-c36f-42e0-8e55-9a6704231782","question_id":"3bfc2548-5d0c-4972-beb5-3b5caace6139","part_label":"a","prompt_latex":"Before finding the cost, what must you work out first? Why?","solution_latex":"The **area** of the deck — the oil is priced per square metre, so we need to know how many square metres there are.","marks":1,"sort_order":0,"criteria":{}},{"id":"f480d03a-732b-4ccd-822f-b3c8178e3777","question_id":"3bfc2548-5d0c-4972-beb5-3b5caace6139","part_label":"b","prompt_latex":"Find the area of the deck.","solution_latex":"$$ A = 6 \\times 4.5 = \\mathbf{27 \\text{ m}^2} $$","marks":1,"sort_order":1,"criteria":{}},{"id":"0ff021ea-8f92-4420-bb59-9c5bfedfd769","question_id":"3bfc2548-5d0c-4972-beb5-3b5caace6139","part_label":"c","prompt_latex":"Find the total cost of oiling the deck.","solution_latex":"$$ 27 \\times 18 = \\mathbf{\\$486} $$","marks":1,"sort_order":2,"criteria":{}}],"_workingLines":{"a":5,"b":10,"c":13}},{"id":"a98e85be-2f73-4562-a433-5a7b1523df51","skill_id":null,"stem_latex":"A rectangular water trough is $80$ cm long, $50$ cm wide and $30$ cm deep. Remember that $1$ cm³ holds $1$ mL.","solution_latex":"Volume, then capacity, then a division to get the time.","difficulty":3,"marks":4,"is_multipart":true,"created_by":"Ryan Park","created_at":"2026-08-20T01:54:04.637883+00:00","updated_at":"2026-08-20T01:54:04.637883+00:00","qtype":"extended","options":[],"correct_option":null,"criteria":{},"topic_id":"053f7655-c652-4a64-9080-3f20e7bf6096","audience":"exam","subtopic_id":"0891ef80-7cc6-4695-a54d-a65c83bbb327","qbank_question_parts":[{"id":"5ad73e48-367f-4029-8efb-1b0449e386b8","question_id":"a98e85be-2f73-4562-a433-5a7b1523df51","part_label":"a","prompt_latex":"Find the volume of the trough, in cubic centimetres.","solution_latex":"$$ V = 80 \\times 50 \\times 30 = \\mathbf{120\\,000 \\text{ cm}^3} $$","marks":1,"sort_order":0,"criteria":{}},{"id":"9bc498e8-6038-4c9c-bfc6-7a6beffd37a6","question_id":"a98e85be-2f73-4562-a433-5a7b1523df51","part_label":"b","prompt_latex":"Write the capacity of the trough in litres.","solution_latex":"$120\\,000$ cm³ $= 120\\,000$ mL, and $1000$ mL $= 1$ L.\n$$ 120\\,000 \\div 1000 = \\mathbf{120 \\text{ L}} $$","marks":1,"sort_order":1,"criteria":{}},{"id":"eb763bf1-a544-4818-8e47-effa52ca853e","question_id":"a98e85be-2f73-4562-a433-5a7b1523df51","part_label":"c","prompt_latex":"A tap fills the trough at $8$ L each minute. How long does it take to fill?","solution_latex":"$$ 120 \\div 8 = \\mathbf{15 \\text{ minutes}} $$","marks":1,"sort_order":2,"criteria":{}}],"_workingLines":{"a":5,"b":10,"c":13}},{"id":"fb6ba1c8-cc44-4c47-8e7d-10e9c45204d2","skill_id":null,"stem_latex":"A baker has $5$ kg of flour. Each loaf of bread uses $450$ g of flour.","solution_latex":"The units differ, so convert before dividing — and read carefully that only **whole** loaves can be baked.","difficulty":3,"marks":4,"is_multipart":true,"created_by":"Ryan Park","created_at":"2026-08-20T01:54:06.096787+00:00","updated_at":"2026-08-20T01:54:06.096787+00:00","qtype":"extended","options":[],"correct_option":null,"criteria":{},"topic_id":"053f7655-c652-4a64-9080-3f20e7bf6096","audience":"exam","subtopic_id":"b2f27c7f-23b0-4eae-80ae-360ecb23455e","qbank_question_parts":[{"id":"f0b8b9ae-9d3a-4262-8d05-6a2d4c8090d4","question_id":"fb6ba1c8-cc44-4c47-8e7d-10e9c45204d2","part_label":"a","prompt_latex":"How many grams of flour does the baker have?","solution_latex":"$$ 5 \\text{ kg} = \\mathbf{5000 \\text{ g}} $$","marks":1,"sort_order":0,"criteria":{}},{"id":"b0b7c5cb-4567-421d-840b-ec6038d3880c","question_id":"fb6ba1c8-cc44-4c47-8e7d-10e9c45204d2","part_label":"b","prompt_latex":"How many whole loaves can the baker make?","solution_latex":"$$ 5000 \\div 450 = 11.1\\ldots $$\nOnly whole loaves count, so $\\mathbf{11}$ loaves.","marks":1,"sort_order":1,"criteria":{}},{"id":"94e35f28-1021-4838-8236-d4f72315d5ad","question_id":"fb6ba1c8-cc44-4c47-8e7d-10e9c45204d2","part_label":"c","prompt_latex":"How much flour is left over?","solution_latex":"$$ 11 \\times 450 = 4950 \\text{ g used} $$\n$$ 5000 - 4950 = \\mathbf{50 \\text{ g}} $$","marks":1,"sort_order":2,"criteria":{}}],"_workingLines":{"a":5,"b":10,"c":13}},{"id":"ffac7d12-0459-4743-9cd5-8ed6d06bef11","skill_id":null,"stem_latex":"Ella must arrive at her swimming lesson at $4{:}15$ PM. Before she leaves she needs $10$ minutes to pack her bag, and the trip there takes $25$ minutes.","solution_latex":"Working backwards from a finishing time — add the parts, then subtract.","difficulty":3,"marks":4,"is_multipart":true,"created_by":"Ryan Park","created_at":"2026-08-20T01:54:07.343879+00:00","updated_at":"2026-08-20T01:54:07.343879+00:00","qtype":"extended","options":[],"correct_option":null,"criteria":{},"topic_id":"702c0b8b-4cbc-4796-9703-8c1b27e53914","audience":"exam","subtopic_id":"3292b89e-e6ed-4ffd-aada-a1ff2716f0b9","qbank_question_parts":[{"id":"8389f3f9-c6b3-4632-9ca6-4433b2d07d02","question_id":"ffac7d12-0459-4743-9cd5-8ed6d06bef11","part_label":"a","prompt_latex":"How long does Ella need altogether?","solution_latex":"$$ 10 + 25 = \\mathbf{35 \\text{ minutes}} $$","marks":1,"sort_order":0,"criteria":{}},{"id":"f804a1e0-eab7-4614-a944-ca9b659909a7","question_id":"ffac7d12-0459-4743-9cd5-8ed6d06bef11","part_label":"b","prompt_latex":"What time must she start packing?","solution_latex":"Count back $35$ minutes from $4{:}15$ PM.\n$$ 4{:}15 - 15 \\text{ min} = 4{:}00, \\quad 4{:}00 - 20 \\text{ min} = \\mathbf{3{:}40 \\text{ PM}} $$","marks":1,"sort_order":1,"criteria":{}},{"id":"ef326874-4f93-4eb0-b64e-1631b515717e","question_id":"ffac7d12-0459-4743-9cd5-8ed6d06bef11","part_label":"c","prompt_latex":"If Ella does not start until $3{:}50$ PM, how many minutes late will she be?","solution_latex":"$$ 3{:}50 + 35 \\text{ min} = 4{:}25 \\text{ PM} $$\n$$ 4{:}25 - 4{:}15 = \\mathbf{10 \\text{ minutes late}} $$","marks":1,"sort_order":2,"criteria":{}}],"_workingLines":{"a":5,"b":10,"c":13}},{"id":"12710504-3db7-4e6a-9a87-2cee0c696950","skill_id":null,"stem_latex":"A rectangular hall is $12$ m long and $8$ m wide. A square storeroom with sides of $3$ m is built in one corner, and its floor is **not** tiled. Tiles cost $\\$32$ for each square metre. Find the cost of tiling the rest of the hall.","solution_latex":"Find the whole floor, take away the part that is not tiled, then cost it.\n$$ \\text{Hall} = 12 \\times 8 = 96 \\text{ m}^2 $$\n$$ \\text{Storeroom} = 3 \\times 3 = 9 \\text{ m}^2 $$\n$$ \\text{Tiled} = 96 -
